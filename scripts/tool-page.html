<!doctype html>
<html>
<head><meta charset="utf-8" /><title>bg-remove tool page</title>
<script type="importmap">
{ "imports": { "onnxruntime-web": "/node_modules/onnxruntime-web/dist/ort.bundle.min.mjs" } }
</script></head>
<body>
<script type="module">
  import { removeBackground } from "/node_modules/@imgly/background-removal/dist/index.mjs";

  async function run(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error("fetch " + url + ": " + res.status);
    const blob = await res.blob();
    const t0 = performance.now();
    const cutout = await removeBackground(blob, {
      model: "isnet_quint8",
      output: { format: "image/png", quality: 1 },
    });
    const buf = new Uint8Array(await cutout.arrayBuffer());
    // base64 in chunks (large arrays blow the call stack otherwise)
    let bin = "";
    for (let i = 0; i < buf.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    }
    return { b64: btoa(bin), bytes: buf.length, ms: Math.round(performance.now() - t0) };
  }

  // Exposed to puppeteer; resolves with the cutout, rejects with the error.
  window.__runBgRemoval = (url) => run(url);
  window.__toolReady = true;
</script>
</body>
</html>
